[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-automation-pipeline"
dynamic = ["version"]
description = "An end-to-end AI-powered pipeline for researching, generating, rendering, and publishing YouTube Shorts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Andrei Cătălin Olariu", email = "andreicatalin.swl@gmail.com" },
]
dependencies = [
    "filelock>=3.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "imageio-ffmpeg>=0.5",
    "langgraph>=1.0",
    "numpy>=2.0",
    "openai-codex>=0.147.0",
    "pillow>=11.0",
    "pydantic>=2.0",
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=4.44",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
content-automation-pipeline = "content_automation_pipeline.__main__:main"

[tool.hatch.version]
path = "src/content_automation_pipeline/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/content_automation_pipeline"]

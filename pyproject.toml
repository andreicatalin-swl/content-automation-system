[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-automation-system"
dynamic = ["version"]
description = "An end-to-end system for managing and automating content workflows for multiple formats and platforms."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Andrei Cătălin Olariu", email = "andreicatalin.swl@gmail.com" },
]
dependencies = [
    "filelock>=3.0",
    "google-api-python-client>=2.0",
    "google-auth[requests]>=2.0",
    "google-auth-oauthlib>=1.2",
    "imageio-ffmpeg>=0.5",
    "langgraph>=1.0",
    "numpy>=2.0",
    "openai-codex>=0.147.0",
    "pillow>=11.0",
    "pydantic>=2.0",
    "torch>=2.9",
    # Required by the Transformers depth-estimation image processor.
    "torchvision>=0.24",
    "transformers>=4.44",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
content-automation-system = "content_automation_system.__main__:main"

[tool.hatch.version]
path = "src/content_automation_system/__about__.py"

[tool.hatch.build]
exclude = [
    "**/credentials/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_automation_system"]

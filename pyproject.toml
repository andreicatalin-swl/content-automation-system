[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-automation-pipeline"
dynamic = ["version"]
description = "An end-to-end AI-powered pipeline for researching, generating, rendering, and publishing YouTube Shorts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Andrei Cătălin Olariu", email = "andreicatalin.swl@gmail.com" },
]
dependencies = [
    "filelock>=3.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "openai-codex>=0.147.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
content-automation-pipeline = "content_automation_pipeline.__main__:main"

[tool.hatch.version]
path = "src/content_automation_pipeline/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/content_automation_pipeline"]
